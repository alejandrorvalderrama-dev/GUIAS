<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas</title>
</head>
<body>
    
    <h1>Explicacion: Rutas Absolutas y Relativas</h1>

    <section>
        <h2>Rutas Absolutas</h2>
        <!-- Ruta completa a un recurso a un servidor externo. La ruta absoluta es la URL completa del recurso, esta no se modifica segun la modificacion del archivo actual -->
         <p>
            
            <img src=""https://www.manualweb.net/img/convers/html5-cover.jpg" alt="Imagen HTML desde un servidor externo"Imagen HTML desde un servidor externo="300" heihgt="200" tittle="HTML5">
         </section>

         <hr>

         <section>
            <h2> Rutas Relativas</h2>
            <!-- Ruta relativa a un recurso dentro del mismo proyecto. La ruta relativa se basa en la ubicacion del archivo actual, y se ajusta segun la estructura de carpetas del proyecto -->

            <p>
                Ir a la pagina de <a href="04_inline_inblock.html">Inline vs Block</a>
                <!-- Funciona si hay un archivo llado "04_inline_inblock.html" en la misma caropeta -->
                 
            </p>
         </section>
         </p>
    </section>
</body>
</html>
