<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>

    <!-- los Enlaces o anclas o hipervinculos -->
     <!-- a (anchor) significa ancla. Metafora. como en un barco te mantiene en un a ubicacion especifica un ancla es justamente para que usuario sepa hacia donde buscar un recurso o hacia donde navegar en la pagina web -->
    <!-- los atributos son caracteristicas que definen el comportamiento de los elemetos en este caso el atributo href vuelve funcional a la etuiqueta es por esta razon que se utiliza en el maquetado y no en el css dado que no es una caracteristica visual.-->

    <!-- Href (hiper reference) es la referencia a un recurso, es decir el destino del enlace.-->
     <!-- lo que esta dentro de la etiqueta es el contexto visible que el usuario vera en la pagina web, mientras que lo que esta dentro del hrefes es la referencia al recurso que apunta el enlace. -->
      <h2> title= "titulo de la pagina"> Enlaces o anclas</h2>

      <!-- por otra parte, el atributo title proporciona un texto de ayuda que se muestra cuando el usuario pasa por el mouse sobre el enlace. las tecnologias de asistencia como lectores de pantalla utilizan este atributo para proporcionar informacion adicional al usuario. En el caso de personas invidentes esto les permite acceder a informacion adicional sobre el enlace. -->

      <a href="http://www.google.com">Google</a>
      <br>
      <a href="http://www.facebook.com"></a>
      <br>
      <a href="http://www.youtube.com">Youtube</a>
      <br>
      <a href="ir al canal de youtube" href= "//youtube.com@ramcrak</a> <!-- mala practica: usar protocolo relativo sin especificar el protocolo-->
      <br>
      <a href="03-1_pagina_enlace1.html"> ir a enlace uno </a>
      <br>
      <a href="03-2_pagina_enlace2.html"> ir a enlace dos </a>
      <br>
      <a href="03-3_pagina_enlace3.html"> ir a enlace tres </a>
      <br>
      <!-- es sumamente importante que en la programacion y el desarrollo web se realicen las practicas a medida que se va a avanzando, de esta forma se asegura una mejor compresion y aplicando de los conceptos aprendidos. Entiendan que la programacion es un proceso activo y no pasivo, una cosa es intentar comprender lo que sucede cuando leen o ven algo que se esta haciendo, sin embargo la unica forma de aprender es probando ustedes mismos todo lo que se debe implementar-->
       <br>

       <h2>Enlaces con target a otra ventana</h2>
       <a href="03-4_pagina_enlace4.html"> target=_blank< ir a enlace 4 en neva ventana</a>
       <!-- el atributo taget "_blank" abre el enlace en una nueva ventana o pestaña del navegador. por defecto siempre esta el self, que significa que se abre en la misma ventana-->
        
</body>
</html>
